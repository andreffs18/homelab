apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    favicon: https://raw.githubusercontent.com/gethomepage/homepage/main/public/favicon.ico
    theme: dark
    color: zinc
    headerStyle: boxedWidgets
    cardBlur: md
    useEqualHeights: true
    hideVersion: true
    iconStyle: gradient
    layout:
      Infrastructure:
        style: row
        columns: 2
        icon: mdi-server-network
      Monitoring:
        style: row
        columns: 3
        icon: mdi-chart-line
      Apps:
        style: row
        columns: 2
        icon: mdi-apps

  services.yaml: |
    - Infrastructure:
        - ArgoCD:
            href: http://argocd.homelab.local
            description: GitOps continuous delivery
            icon: argo-cd.png
        # - Pi-hole:
        #     href: http://pihole.homelab.local/admin
        #     description: DNS sinkhole & ad blocker
        #     icon: pi-hole.png

    - Monitoring:
        - Grafana:
            href: http://grafana.homelab.local
            description: Metrics & dashboards
            icon: grafana.png
        - Prometheus:
            href: http://prometheus.homelab.local
            description: Metrics collection
            icon: prometheus.png
        - Alertmanager:
            href: http://alertmanager.homelab.local
            description: Alert routing
            icon: alertmanager.png

    - Apps:
        - Home Assistant:
            href: http://homeassistant.homelab.local
            description: Home automation
            icon: home-assistant.png
        - Whoami:
            href: http://whoami.homelab.local
            description: Debug/echo service
            icon: docker-moby.png

  widgets.yaml: |
    - greeting:
        text_size: 3xl
        text: Welcome home
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: disabled
