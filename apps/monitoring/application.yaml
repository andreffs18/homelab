apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.4.0
    helm:
      values: |
        grafana:
          enabled: true
          adminPassword: changeme  # TODO: replace with sealed secret
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.homelab.local
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: community
                  orgId: 1
                  folder: Community
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/community
          dashboards:
            community:
              node-exporter-full:
                gnetId: 1860
                revision: 37
                datasource: Prometheus
              k8s-views-global:
                gnetId: 15757
                revision: 37
                datasource: Prometheus
              k8s-views-nodes:
                gnetId: 15759
                revision: 29
                datasource: Prometheus
              k8s-views-pods:
                gnetId: 15760
                revision: 28
                datasource: Prometheus

        prometheus:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - prometheus.homelab.local
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 20Gi
            additionalScrapeConfigs:
              - job_name: nginx-ingress
                static_configs:
                  - targets: [ingress-nginx-controller-metrics.ingress-nginx.svc:10254]

        alertmanager:
          enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - alertmanager.homelab.local

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
