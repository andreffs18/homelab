# Consumed by the pihole StatefulSet as FTLCONF_webserver_api_password (Pi-hole v6 web/API password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-web-password
  namespace: pihole
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: pihole-web-password
  data:
    - secretKey: password
      remoteRef:
        key: PIHOLE_WEB_PASSWORD
