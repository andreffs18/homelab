apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: pihole
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Pi-hole v6 serves 404 on /, so send the bare host to the web UI
    nginx.ingress.kubernetes.io/app-root: /admin/
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pihole.home.andreffs.com
      secretName: pihole-tls
  rules:
    - host: pihole.home.andreffs.com
      http:
        paths:
          # Whole host, not just /admin: the v6 web UI also calls the API under /api
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole-web
                port:
                  number: 80
