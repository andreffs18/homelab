apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domain-exporter
  namespace: domain-exporter
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - domains.home.andreffs.com
      secretName: domain-exporter-tls
  rules:
    - host: domains.home.andreffs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domain-exporter
                port:
                  number: 9222
