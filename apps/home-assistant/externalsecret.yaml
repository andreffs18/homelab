# Reference only: nothing in the cluster consumes this Secret yet (HA keeps its own password hash)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-credentials
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: home-assistant-credentials
  data:
    - secretKey: password
      remoteRef:
        key: HOME_ASSISTANT_PASSWORD
