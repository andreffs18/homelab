apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
#    # Tailscale operator will expose this service on your tailnet
#    tailscale.com/expose: "true"
#    tailscale.com/hostname: home-assistant
spec:
  # ClusterIP: reachable only through the ingress (homeassistant.home.andreffs.com)
  type: ClusterIP
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
