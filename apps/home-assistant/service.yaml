apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.152
#    # Tailscale operator will expose this service on your tailnet
#    tailscale.com/expose: "true"
#    tailscale.com/hostname: home-assistant
spec:
  type: LoadBalancer
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
