apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tev1
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andreffs18/homelab.git
    targetRevision: HEAD
    path: apps/tev1
    directory:
      exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: laya
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
