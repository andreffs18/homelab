# Self-signed CA -> issuer -> cert for bitwarden-sdk-server.
# Produces the `bitwarden-tls-certs` secret (tls.crt, tls.key, ca.crt) the chart mounts.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-selfsigned
  namespace: external-secrets
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-ca
  namespace: external-secrets
spec:
  isCA: true
  commonName: bitwarden-sdk-server-ca
  secretName: bitwarden-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: bitwarden-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-ca
  namespace: external-secrets
spec:
  ca:
    secretName: bitwarden-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls-certs
  namespace: external-secrets
spec:
  secretName: bitwarden-tls-certs
  dnsNames:
    - bitwarden-sdk-server
    - bitwarden-sdk-server.external-secrets.svc
    - bitwarden-sdk-server.external-secrets.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: bitwarden-ca
    kind: Issuer
