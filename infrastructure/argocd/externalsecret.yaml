# Reference only: ArgoCD manages its admin password itself (argocd-secret needs a bcrypt hash), so nothing consumes this yet
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: argocd-admin-credentials
  data:
    - secretKey: password
      remoteRef:
        key: ARGOCD_ADMIN_PASSWORD
